<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>משפחת כהן · חמישה סגנונות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@200;300;400;500;700&family=Playpen+Sans+Hebrew:wght@400;600;700&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @property --s1 { syntax: '<color>'; inherits: true; initial-value: #050818; }
  @property --s2 { syntax: '<color>'; inherits: true; initial-value: #0f1736; }
  @property --s3 { syntax: '<color>'; inherits: true; initial-value: #1b2650; }

  :root { --bar: 56px; --u: min(1vw, calc((100vh - var(--bar)) / 56.25)); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #05060c; overflow: hidden; }

  /* ================= בסיס משותף ================= */
  .stage { position: relative; overflow: hidden; width: calc(var(--u) * 100); height: calc(var(--u) * 56.25); margin: 0 auto;
    font-size: calc(var(--u) * 1.25); transition: --s1 1.6s ease, --s2 1.6s ease, --s3 1.6s ease;
    --ff-d: 'Frank Ruhl Libre', serif; --ff-b: 'Assistant', sans-serif; }
  .stage[data-scheme="dark"], .ink-light {
    --ink: #fdf8ef; --soft: rgba(253,248,239,.72); --faint: rgba(253,248,239,.4);
    --glass: rgba(10,16,36,.40); --hi: rgba(255,255,255,.13); --line: rgba(255,255,255,.17); --accent: #ffbd66; }
  .stage[data-scheme="light"], .ink-dark {
    --ink: #12233d; --soft: rgba(18,35,61,.72); --faint: rgba(18,35,61,.38);
    --glass: rgba(255,255,255,.46); --hi: rgba(255,255,255,.8); --line: rgba(18,35,61,.14); --accent: #c2501c; }
  .ink-light, .ink-dark { color: var(--ink); }
  .bdrow { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 1em; }
  .bdrow .bd { border: 0; padding: 0; flex-direction: row-reverse; justify-content: flex-end; } .bdrow .badge, .bdrow .long, .bd .short { display: none; } .bdrow .short { display: inline; } .bdrow .bd .in { min-width: 0; }
  .sty { position: absolute; inset: 0; display: none; font-family: var(--ff-b); color: var(--ink); transition: color 1.2s ease, background 1.2s ease; }
  .sty.on { display: block; }

  .layer, .skybox { position: absolute; inset: 0; pointer-events: none; }
  .skybox { overflow: hidden; }
  .sky { background: linear-gradient(180deg, var(--s1) 0%, var(--s2) 52%, var(--s3) 100%); }
  .glow { background: var(--glow); }
  .veil { background: var(--veil); transition: background 1.6s ease; }
  .stars { opacity: 0; transition: opacity 2s ease; animation: twinkle 5s ease-in-out infinite alternate;
    background-image:
      radial-gradient(circle at 12% 18%, #fff 0 .09em, transparent .11em), radial-gradient(circle at 31% 9%, #fff 0 .06em, transparent .08em),
      radial-gradient(circle at 47% 26%, #fff 0 .07em, transparent .09em), radial-gradient(circle at 63% 12%, #fff 0 .1em, transparent .12em),
      radial-gradient(circle at 78% 31%, #fff 0 .06em, transparent .08em), radial-gradient(circle at 90% 8%, #fff 0 .08em, transparent .1em),
      radial-gradient(circle at 22% 41%, #fff 0 .05em, transparent .07em), radial-gradient(circle at 56% 44%, #fff 0 .05em, transparent .07em),
      radial-gradient(circle at 84% 52%, #fff 0 .06em, transparent .08em), radial-gradient(circle at 6% 58%, #fff 0 .05em, transparent .07em); }
  .stage[data-phase="night"][data-weather="clear"] .stars { opacity: .85; }
  @keyframes twinkle { from { filter: brightness(.7); } to { filter: brightness(1.3); } }
  .clouds i { position: absolute; border-radius: 50%; background: #fff; filter: blur(calc(var(--u) * 3)); opacity: 0; transition: opacity 1.6s ease; }
  .clouds i:nth-child(1) { width: 46%; height: 22%; top: -6%; right: -8%; animation: drift 70s linear infinite alternate; }
  .clouds i:nth-child(2) { width: 38%; height: 18%; top: 4%; right: 38%; animation: drift 95s linear infinite alternate-reverse; }
  .clouds i:nth-child(3) { width: 42%; height: 20%; top: -4%; right: 72%; animation: drift 80s linear infinite alternate; }
  .stage[data-weather="clouds"] .clouds i { opacity: .5; }
  .stage[data-weather="rain"] .clouds i { opacity: .16; }
  .stage[data-weather="snow"] .clouds i { opacity: .4; }
  .stage:not([data-phase="day"]) .clouds i { filter: blur(calc(var(--u) * 3)) brightness(.6); }
  @keyframes drift { from { transform: translateX(-6%); } to { transform: translateX(6%); } }
  .fog i { position: absolute; right: -20%; width: 140%; height: 26%; border-radius: 50%; background: #eef1f4; filter: blur(calc(var(--u) * 4)); opacity: 0; transition: opacity 1.6s ease; }
  .fog i:nth-child(1) { top: 8%; animation: drift 40s ease-in-out infinite alternate; }
  .fog i:nth-child(2) { top: 40%; animation: drift 55s ease-in-out infinite alternate-reverse; }
  .fog i:nth-child(3) { top: 72%; animation: drift 47s ease-in-out infinite alternate; }
  .stage[data-weather="fog"] .fog i { opacity: .42; }
  .stage[data-weather="fog"]:not([data-phase="day"]) .fog i { opacity: .2; }
  .fx i { position: absolute; top: -12%; }
  .fx i.drop { width: calc(var(--u) * .09); height: calc(var(--u) * 4.5); border-radius: 1em; background: linear-gradient(180deg, transparent, rgba(255,255,255,.55)); transform: rotate(10deg); animation: fall linear infinite; }
  .fx i.flake { border-radius: 50%; background: #fff; box-shadow: 0 0 .5em rgba(255,255,255,.8); animation: snow linear infinite; }
  @keyframes fall { to { transform: translate(calc(var(--u) * -9), calc(var(--u) * 70)) rotate(10deg); } }
  @keyframes snow { 25% { transform: translate(calc(var(--u) * 1.5), calc(var(--u) * 17)); } 50% { transform: translate(calc(var(--u) * -1), calc(var(--u) * 34)); }
    75% { transform: translate(calc(var(--u) * 1.2), calc(var(--u) * 51)); } 100% { transform: translate(0, calc(var(--u) * 68)); } }
  .orb { position: absolute; width: calc(var(--u) * 7); height: calc(var(--u) * 7); border-radius: 50%; transform: translate(-50%, -50%);
    background: radial-gradient(circle, #fff7d6 0 38%, #ffd27a 60%, rgba(255,190,90,0) 72%); box-shadow: 0 0 calc(var(--u) * 6) calc(var(--u) * 2) rgba(255,205,120,.55);
    transition: left 1.6s ease, top 1.6s ease, background 1.6s ease, box-shadow 1.6s ease; }
  .orb.moon { background: radial-gradient(circle at 38% 38%, #fff 0 30%, #dfe6ff 62%, #b9c4ee 100%); box-shadow: 0 0 calc(var(--u) * 4) calc(var(--u) * .6) rgba(190,205,255,.4); width: calc(var(--u) * 4.6); height: calc(var(--u) * 4.6); }
  .stage:not([data-weather="clear"]):not([data-weather="clouds"]) .orb { opacity: .25; }

  .photo { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(135deg, #6b4a3a, #c98a5a 55%, #f1c98f); }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 2.2s ease; animation: kb 24s ease-in-out infinite alternate; }
  .photo img.on { opacity: 1; }
  @keyframes kb { from { transform: scale(1.02); } to { transform: scale(1.1) translate(-1.2%, -1%); } }

  svg.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .card { background: var(--glass); border: 1px solid var(--line); border-radius: calc(var(--u) * 1.5); padding: calc(var(--u) * 1.15) calc(var(--u) * 1.5);
    display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; transition: background 1.2s ease; }
  .label { font-size: .8em; font-weight: 700; letter-spacing: .13em; color: var(--soft); margin-bottom: .7em; display: flex; align-items: center; gap: .5em; white-space: nowrap; }
  .label::before { content: ''; width: .55em; height: .55em; border-radius: 50%; background: var(--accent); flex: none; }
  .label em { font-style: normal; font-weight: 500; letter-spacing: 0; color: var(--faint); }
  .fam { font-size: 1.15em; font-weight: 600; letter-spacing: .32em; color: var(--soft); }
  .clock { font-family: var(--ff-d); font-weight: 500; line-height: .86; letter-spacing: -.02em; direction: ltr; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .clock .colon { animation: blink 2s steps(1) infinite; position: relative; top: -.06em; }
  @keyframes blink { 50% { opacity: .35; } }
  .date { font-size: 1.8em; font-weight: 500; white-space: nowrap; }
  .num { font-family: var(--ff-d); }

  .wx-now { display: flex; align-items: center; gap: .8em; }
  .wx-now > .ic { font-size: 4.2em; stroke-width: 1.3; color: var(--accent); }
  .wx-temp { font-family: var(--ff-d); font-size: 4.4em; line-height: 1; direction: ltr; }
  .wx-meta { font-size: 1em; color: var(--soft); line-height: 1.45; white-space: nowrap; }
  .wx-meta b { color: var(--ink); font-weight: 600; font-size: 1.15em; display: block; }
  .wx-meta span { display: inline-flex; align-items: center; gap: .3em; margin-inline-end: .8em; }
  .fc { display: grid; grid-template-columns: repeat(5, 1fr); gap: .45em; text-align: center; }
  .fc div { padding: .4em 0; border-radius: .9em; background: var(--hi); display: flex; flex-direction: column; align-items: center; }
  .fc small { font-size: .88em; color: var(--soft); }
  .fc .ic { font-size: 1.4em; margin: .15em 0 .05em; }
  .fc b { font-family: var(--ff-d); font-size: 1.4em; font-weight: 500; }
  .arc svg { width: 100%; display: block; overflow: visible; }
  .ends { display: flex; justify-content: space-between; font-size: 1em; color: var(--soft); margin-top: -.3em; white-space: nowrap; }
  .ends b { font-family: var(--ff-d); font-size: 1.35em; font-weight: 500; color: var(--ink); margin-inline-start: .3em; }

  .who { font-size: .82em; padding: .12em .7em; border-radius: 1em; background: var(--c); color: #fff; font-weight: 700; white-space: nowrap; flex: none; }
  .li { display: flex; align-items: center; gap: .7em; padding: .36em 0; }
  .li + .li { border-top: 1px solid var(--line); }
  .li .who { min-width: 4.4em; text-align: center; font-size: .9em; }
  .li b { font-size: 1.15em; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meals { display: grid; grid-template-columns: 1fr 1fr; gap: 1em; }
  .meal small { display: block; font-size: .85em; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
  .meal b { display: block; font-size: 1.2em; font-weight: 600; line-height: 1.25; }
  .row { display: flex; align-items: center; gap: .7em; padding: .42em 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .t { font-family: var(--ff-d); font-size: 1.3em; min-width: 2.9em; direction: ltr; text-align: right; }
  .row .main { flex: 1; min-width: 0; }
  .row .main b { display: block; font-size: 1.18em; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .main small { display: block; font-size: .92em; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { width: 2.2em; height: 2.2em; border-radius: 50%; display: grid; place-items: center; font-size: 1.05em; flex: none; background: var(--c, var(--hi)); color: #fff; font-weight: 700; }
  .row.past { opacity: .42; }
  .row.next { background: var(--hi); border-radius: 1em; padding-inline: .7em; margin-inline: -.7em; border-top-color: transparent; box-shadow: inset 0 0 0 1.5px var(--accent); }
  .row.next + .row { border-top-color: transparent; }
  .task { display: flex; align-items: center; gap: .65em; padding: .36em 0; }
  .task .box { width: 1.4em; height: 1.4em; border-radius: .42em; border: 2px solid var(--soft); display: grid; place-items: center; flex: none; }
  .task .box .ic { stroke-width: 3; opacity: 0; }
  .task.done .box { background: var(--accent); border-color: var(--accent); color: #1a1208; }
  .task.done .box .ic { opacity: 1; }
  .task b { flex: 1; font-size: 1.14em; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task.done b { text-decoration: line-through; color: var(--faint); font-weight: 500; }
  .task small { font-size: .86em; color: var(--soft); white-space: nowrap; }
  .task .hi { width: .55em; height: .55em; border-radius: 50%; background: #ff6b5e; flex: none; }
  .bd { display: flex; align-items: center; gap: .7em; padding: .3em 0; }
  .bd + .bd { border-top: 1px solid var(--line); }
  .bd .main { flex: 1; min-width: 0; }
  .bd .main b { display: block; font-size: 1.15em; line-height: 1.15; white-space: nowrap; }
  .bd .main small { display: block; font-size: .9em; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bd .in { text-align: center; line-height: 1; min-width: 2.8em; }
  .bd .in b { font-family: var(--ff-d); font-size: 1.8em; font-weight: 500; color: var(--accent); display: block; }
  .bd .in small { font-size: .74em; color: var(--soft); }
  .quote { font-family: var(--ff-d); font-size: 1.5em; line-height: 1.3; }
  .quote small { display: block; font-family: var(--ff-b); font-size: .5em; font-weight: 700; letter-spacing: .16em; color: var(--soft); margin-bottom: .4em; }

  /* ================= 1 · זכוכית ושמיים ================= */
  .s-glass .ui { position: absolute; inset: 0; padding: calc(var(--u) * 2.5) calc(var(--u) * 3); display: grid; grid-template-columns: calc(var(--u) * 31) 1fr 1fr; grid-template-rows: minmax(0, 1fr); gap: calc(var(--u) * 1.9); }
  .s-glass .col { display: flex; flex-direction: column; gap: calc(var(--u) * 1.4); min-height: 0; min-width: 0; }
  .s-glass .card { backdrop-filter: blur(calc(var(--u) * 1.4)) saturate(1.25); border-color: rgba(255,255,255,.2); box-shadow: 0 calc(var(--u) * .8) calc(var(--u) * 2.4) rgba(0,0,0,.14); }
  .s-glass .clock { font-size: 10.2em; margin: .07em 0 .09em; }
  .s-glass .arc { margin-top: .4em; }
  .s-glass .wxcard { gap: .8em; margin-top: auto; }
  .s-glass .grow { flex: 1; }
  .s-glass .frame { flex: 1; min-height: 0; position: relative; border-radius: calc(var(--u) * 1.8); overflow: hidden; border: calc(var(--u) * .3) solid var(--hi); box-shadow: 0 calc(var(--u) * 1.2) calc(var(--u) * 3.5) rgba(0,0,0,.3); }
  .cap { position: absolute; inset: auto 0 0 0; padding: 3.5em 1.2em .9em; color: #fff; background: linear-gradient(180deg, transparent, rgba(0,0,0,.72)); }
  .cap .quote { font-size: 1.35em; } .cap .quote small { color: rgba(255,255,255,.75); }

  /* ================= 2 · מגזין ================= */
  .s-mag { --ff-d: 'Frank Ruhl Libre', serif; background: var(--paper); --paper: #f5eee2; }
  .stage[data-phase="dawn"] .s-mag { --paper: #f7e4d4; } .stage[data-phase="sunset"] .s-mag { --paper: #f3d8c2; }
  .stage[data-phase="day"][data-weather="rain"] .s-mag, .stage[data-phase="day"][data-weather="fog"] .s-mag { --paper: #e6e7e6; }
  .stage[data-phase="night"] .s-mag { --paper: #11152a; --ink: #f4ead8; --soft: rgba(244,234,216,.7); --faint: rgba(244,234,216,.38); --line: rgba(244,234,216,.2); --accent: #ffb866; --hi: rgba(255,255,255,.08); }
  .stage:not([data-phase="night"]) .s-mag { --ink: #1c1a17; --soft: rgba(28,26,23,.68); --faint: rgba(28,26,23,.36); --line: rgba(28,26,23,.2); --accent: #b3381f; --hi: rgba(28,26,23,.06); }
  .s-mag .ui { position: absolute; inset: 0; padding: calc(var(--u) * 2) calc(var(--u) * 3.4) calc(var(--u) * 2.2); display: flex; flex-direction: column; }
  .s-mag .mast { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; padding-bottom: .7em; border-bottom: calc(var(--u) * .12) solid var(--ink); position: relative; margin-bottom: calc(var(--u) * 1.7); }
  .s-mag .mast::after { content: ''; position: absolute; inset: auto 0 calc(var(--u) * -.55) 0; height: calc(var(--u) * .32); background: var(--ink); }
  .s-mag .mast h1 { font-family: var(--ff-d); font-weight: 900; font-size: 4.4em; line-height: .95; letter-spacing: -.01em; }
  .s-mag .mast .motto { text-align: center; font-family: var(--ff-d); font-style: italic; font-size: 1.45em; max-width: 24em; }
  .s-mag .mast .motto small { display: block; font-family: var(--ff-b); font-style: normal; font-size: .52em; font-weight: 700; letter-spacing: .2em; color: var(--accent); }
  .s-mag .mast .dl { text-align: left; font-size: 1.35em; font-weight: 600; line-height: 1.3; }
  .s-mag .mast .dl small { display: block; font-size: .78em; font-weight: 500; color: var(--soft); }
  .s-mag .body { flex: 1; min-height: 0; display: grid; grid-template-columns: calc(var(--u) * 33) 1fr calc(var(--u) * 27); grid-template-rows: minmax(0, 1fr); }
  .s-mag .col { display: flex; flex-direction: column; gap: calc(var(--u) * 1.3); min-height: 0; min-width: 0; padding-inline: calc(var(--u) * 2.2); border-inline-start: 1px solid var(--line); }
  .s-mag .col:first-child { padding-inline-start: 0; border: 0; } .s-mag .col:last-child { padding-inline-end: 0; }
  .s-mag .clock { font-size: 10.2em; font-weight: 700; line-height: .8; margin-top: .03em; }
  .s-mag .skywin { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  .s-mag .skywin .arc { position: absolute; inset: auto 6% 8% 6%; color: #fff; --faint: rgba(255,255,255,.6); --line: rgba(255,255,255,.35); --accent: #ffd27a; --ink: #fff; }
  .stage[data-scheme="light"] .s-mag .skywin .arc { --faint: rgba(18,35,61,.5); --line: rgba(18,35,61,.25); --accent: #e0661c; --ink: #12233d; }
  .s-mag .figcap { font-size: .95em; color: var(--soft); display: flex; justify-content: space-between; margin-top: calc(var(--u) * -.8); }
  .s-mag .figcap b { color: var(--ink); font-family: var(--ff-d); font-size: 1.2em; }
  .s-mag .wxline { display: flex; flex-direction: column; gap: .7em; border-top: 1px solid var(--line); padding-top: .7em; }
  .s-mag .wx-now > .ic { font-size: 3em; } .s-mag .wx-temp { font-size: 3.6em; font-weight: 700; } .s-mag .wx-meta { font-size: .92em; }
  .s-mag .fc div { background: none; border-radius: 0; border-inline-start: 1px solid var(--line); padding: 0; } .s-mag .fc div:first-child { border: 0; } .s-mag .fc .ic { margin: .05em 0 0; font-size: 1.15em; } .s-mag .fc b { font-size: 1.2em; font-weight: 700; }
  .s-mag .card { background: none; border: 0; border-top: calc(var(--u) * .16) solid var(--ink); border-radius: 0; padding: .55em 0 0; }
  .s-mag .label { font-family: var(--ff-d); font-size: 1.3em; font-weight: 700; letter-spacing: 0; color: var(--ink); margin-bottom: .3em; }
  .s-mag .label::before { display: none; } .s-mag .label em { font-family: var(--ff-b); font-size: .7em; color: var(--accent); font-weight: 700; }
  .s-mag .who { background: none; color: var(--ink); padding: 0; font-size: 1em; font-family: var(--ff-d); text-align: right; min-width: 3.4em; border-inline-start: .25em solid var(--c); padding-inline-start: .45em; border-radius: 0; }
  .s-mag .li b { font-weight: 500; }
  .s-mag .row.next { border-radius: 0; box-shadow: inset .3em 0 0 var(--accent); background: var(--hi); }
  .s-mag .badge { background: none; font-size: 1.3em; width: 1.6em; }
  .s-mag .bd .badge { display: none; }
  .s-mag .task .box { border-radius: 0; border-width: 1.5px; } .s-mag .task .who { font-size: .9em; min-width: 0; }
  .s-mag .figure { flex: 1; min-height: 0; position: relative; overflow: hidden; filter: saturate(.9) contrast(1.03); }
  .s-mag .grow { flex: none; }

  /* ================= 3 · אופק ================= */
  .s-hor { --ff-d: 'Heebo', sans-serif; --ff-b: 'Heebo', sans-serif; --h1: #7fb07a; --h2: #4f8f6a; --h3: #2f6b57; }
  .stage[data-phase="dawn"] .s-hor { --h1: #7a6390; --h2: #4d4275; --h3: #2b2a52; }
  .stage[data-phase="sunset"] .s-hor { --h1: #8a4468; --h2: #542d58; --h3: #2a1d40; }
  .stage[data-phase="night"] .s-hor { --h1: #1a2550; --h2: #111a3a; --h3: #0a0f24; }
  .stage[data-phase="day"][data-weather="rain"] .s-hor, .stage[data-phase="day"][data-weather="fog"] .s-hor { --h1: #63798a; --h2: #485c6d; --h3: #303f50; }
  .stage[data-phase="day"][data-weather="snow"] .s-hor { --h1: #eef3f8; --h2: #c9d6e2; --h3: #8fa4b8; }
  .s-hor .hills { position: absolute; inset: auto 0 0 0; height: calc(var(--u) * 30); width: 100%; }

const ICONS = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  clouds: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
  rain: '<path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24M16 14v6M8 14v6M12 16v6"/>',
  fog: '<path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24M16 17H7M17 21H9"/>',
  snow: '<path d="M2 12h20M12 2v20M20 16l-4-4 4-4M4 8l4 4-4 4M16 4l-4 4-4-4M8 20l4-4 4 4"/>',
  wind: '<path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2M9.6 4.6A2 2 0 1 1 11 8H2M12.6 19.4A2 2 0 1 0 14 16H2"/>',
  drop: '<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

const SUNRISE = 397, SUNSET = 1104; // 06:37, 18:24
const WX = {
  clear: { text: 'בהיר', temp: 26, feels: 27 }, clouds: { text: 'מעונן חלקית', temp: 23, feels: 23 },
  rain: { text: 'גשם', temp: 15, feels: 13 }, fog: { text: 'ערפל', temp: 14, feels: 13 }, snow: { text: 'שלג', temp: 0, feels: -3 },
};
const M = {
  maor: { name: 'מאור', c: '#2f9e7a', born: '1984-09-15' }, nofar: { name: 'נופר', c: '#0f9aa8', born: '1991-08-14' },
  alma: { name: 'אלמה', c: '#e2607a', born: '2015-06-01' }, gaya: { name: 'גאיה', c: '#8a63d2', born: '2017-09-30' },
  eylon: { name: 'אילון', c: '#3f8fdc', born: '2020-09-07' }, neri: { name: 'נרי', c: '#e08a1a', born: '2022-10-29' },
};
// דוגמאות תוכן בלבד: הכריכים, הארוחות, החוגים והמשימות יוזנו ב-Admin
const SAND = [['alma', 'פיתה עם חומוס ומלפפון'], ['gaya', 'לחמנייה עם גבינה צהובה'], ['eylon', 'טוסט גבינה לבנה וזיתים'], ['neri', 'פרוסה עם אבוקדו']];
const MEALS = [['צהריים', 'שניצל, אורז וסלט'], ['ערב', 'פסטה ברוטב עגבניות']];
const ACTS = [
  { at: 960, end: 1035, icon: '🤸', who: 'alma', title: 'התעמלות קרקע', sub: 'מרכז הספורט' },
  { at: 990, end: 1050, icon: '🎨', who: 'gaya', title: 'ציור', sub: 'המתנ״ס' },
  { at: 1020, end: 1080, icon: '⚽', who: 'eylon', title: 'כדורגל', sub: 'מגרש השכונה' },
];
const TASKS = [
  { t: 'לקנות חלב', done: true, who: 'maor', due: 'היום' }, { t: 'להכין תיקים לבית הספר', who: 'alma', due: 'היום', hi: true },
  { t: 'לשלם חשבון חשמל', who: 'nofar', due: 'מחר' }, { t: 'להזמין ניקיון', due: 'יום ג׳' },
];
const DAYS = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const FORECAST = [['clear', 27], ['clear', 25], ['clouds', 24], ['rain', 21], ['clouds', 23]];
const PHOTOS = ['cohen-a', 'cohen-b', 'cohen-c', 'cohen-d'].map(s => `https://picsum.photos/seed/${s}/1400/1000`);
const QUOTE = '״הדברים הגדולים מתחילים בצעדים קטנים.״';

const stage = document.getElementById('stage');
const state = { style: 'glass', time: 'live', weather: 'clear' };
const hhmm = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const fill = (slot, html) => document.querySelectorAll(`[data-slot="${slot}"]`).forEach(el => el.innerHTML = html);

function nowMin() {
  if (state.time === 'live' || state.time === 'dim') { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  return +state.time;
}
function phaseOf(m) {
  if (m >= SUNRISE - 40 && m < SUNRISE + 55) return 'dawn';
  if (m >= SUNSET - 55 && m < SUNSET + 35) return 'sunset';
  return m > SUNRISE && m < SUNSET ? 'day' : 'night';
}
function skyOf(phase, w) {
  const sky = { veil: 'transparent', ...{
    dawn:   { c: ['#1f2b55', '#8a5a83', '#f0a877'], scheme: 'dark',  glow: 'radial-gradient(60% 55% at 85% 100%, rgba(255,196,128,.75), transparent 70%)' },
    day:    { c: ['#4f9fe6', '#9bcdf4', '#e9f6fd'], scheme: 'light', glow: 'radial-gradient(45% 50% at 50% -5%, rgba(255,250,220,.9), transparent 70%)' },
    sunset: { c: ['#2a2552', '#b54a72', '#f59e56'], scheme: 'dark',  glow: 'radial-gradient(60% 55% at 12% 100%, rgba(255,170,90,.8), transparent 70%)' },
    night:  { c: ['#050818', '#0f1736', '#1b2650'], scheme: 'dark',  glow: 'radial-gradient(40% 45% at 20% 0%, rgba(150,170,255,.22), transparent 70%)' },
  }[phase] };
  if (phase === 'day') {
    if (w === 'clouds') sky.c = ['#7fa9cf', '#b6d0e5', '#e8eff5'];
    if (w === 'rain') { sky.c = ['#35435a', '#56687f', '#8494a5']; sky.scheme = 'dark'; sky.glow = 'none'; }
    if (w === 'fog') { sky.c = ['#a9b3bc', '#c9d0d6', '#e8ebee']; sky.glow = 'none'; }
    if (w === 'snow') { sky.c = ['#9db3c9', '#cfdbe6', '#f5f8fb']; sky.glow = 'none'; }
  } else {
    sky.veil = { rain: 'rgba(14,20,34,.5)', fog: 'rgba(190,196,208,.2)', snow: 'rgba(210,222,240,.14)', clouds: 'rgba(40,46,66,.22)' }[w] || 'transparent';
  }
  return sky;
}
// מיקום השמש/הירח: 0 = זריחה (ימין), 1 = שקיעה (שמאל)
function orbPos(m) {
  const day = m > SUNRISE && m < SUNSET;
  const span = day ? SUNSET - SUNRISE : 1440 - (SUNSET - SUNRISE);
  const t = day ? (m - SUNRISE) / span : ((m - SUNSET + 1440) % 1440) / span;
  return { day, t, left: (1 - t) * 100, top: 78 - Math.sin(Math.PI * t) * 62 };
}

const upcomingBirthdays = () => {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Object.values(M).map(p => {
    const [y, mo, d] = p.born.split('-').map(Number);
    let next = new Date(today.getFullYear(), mo - 1, d);
    if (next < today) next = new Date(today.getFullYear() + 1, mo - 1, d);
    return { ...p, days: Math.round((next - today) / 864e5), age: next.getFullYear() - y,
      short: `${d}.${mo}`, date: new Intl.DateTimeFormat('he-IL', { day: 'numeric', month: 'long' }).format(next) };
  }).sort((a, b) => a.days - b.days).slice(0, 3);
};

const R = {
  wxnow(night) {
    const w = WX[state.weather], icon = state.weather === 'clear' ? (night ? 'moon' : 'sun') : state.weather;
    return `${ic(icon)}<div class="wx-temp">${w.temp}°</div><div class="wx-meta"><b>${w.text} · יקנעם עילית</b>מרגיש כמו ${w.feels}°<br><span>${ic('drop')}48%</span><span>${ic('wind')}12 קמ״ש</span></div>`;
  },
  fc() {
    const today = new Date().getDay();
    return FORECAST.map(([k, t], i) => `<div><small>${DAYS[(today + i + 1) % 7]}</small>${ic(k === 'clear' ? 'sun' : k)}<b>${t}°</b></div>`).join('');
  },
  arcsvg(m) {
    const { day, t } = orbPos(m);
    const x = (1 - t) ** 2 * 290 + 2 * (1 - t) * t * 150 + t ** 2 * 10, y = (1 - t) ** 2 * 46 + 2 * (1 - t) * t * -38 + t ** 2 * 46;
    const body = day ? `<circle cx="${x}" cy="${y}" r="15" fill="var(--accent)" opacity=".22"/><circle cx="${x}" cy="${y}" r="7.5" fill="var(--accent)"/>`
      : `<g transform="translate(${x - 9} ${y - 9}) scale(.75)" fill="var(--ink)" opacity=".85">${ICONS.moon}</g>`;
    return `<svg viewBox="0 -4 300 56" aria-hidden="true"><path d="M290 46 Q150 -38 10 46" fill="none" stroke="var(--faint)" stroke-width="1.2" stroke-dasharray="2 5" stroke-linecap="round"/>
      <line x1="0" y1="46" x2="300" y2="46" stroke="var(--line)" stroke-width="1"/>${body}</svg>`;
  },
  suntimes: () => `<span>זריחה<b class="num">${hhmm(SUNRISE)}</b></span><span>שקיעה<b class="num">${hhmm(SUNSET)}</b></span>`,
  sand: () => SAND.map(([k, s]) => `<div class="li"><span class="who" style="--c:${M[k].c}">${M[k].name}</span><b>${s}</b></div>`).join(''),
  meals: () => MEALS.map(([k, s]) => `<div class="meal"><small>${k}</small><b>${s}</b></div>`).join(''),
  acts(m) {
    const next = ACTS.find(e => e.end > m);
    return ACTS.map(e => `<div class="row ${e.end <= m ? 'past' : e === next ? 'next' : ''}"><span class="t">${hhmm(e.at)}</span><span class="badge" style="--c:${M[e.who].c}">${e.icon}</span>
      <span class="main"><b>${M[e.who].name} · ${e.title}</b><small>עד ${hhmm(e.end)} · ${e.sub}</small></span></div>`).join('');
  },
  tasks: () => TASKS.map(t => `<div class="task ${t.done ? 'done' : ''}"><span class="box">${ic('check')}</span><b>${t.t}</b>${t.hi && !t.done ? '<i class="hi"></i>' : ''}
      ${t.who ? `<span class="who" style="--c:${M[t.who].c}">${M[t.who].name}</span>` : ''}<small>${t.due}</small></div>`).join(''),
  bdays: () => upcomingBirthdays().map(b => `<div class="bd"><span class="badge" style="--c:${b.c}">${b.name[0]}</span>
      <span class="main"><b>${b.name}</b><small><span class="long">${b.date} · גיל ${b.age}</span><span class="short">${b.short}</span></small></span><span class="in"><b>${b.days}</b><small>ימים</small></span></div>`).join(''),
};

function particles() {
  document.querySelectorAll('.fx').forEach(fx => {
    let html = '';
    if (state.weather === 'rain') for (let i = 0; i < 70; i++)
      html += `<i class="drop" style="right:${Math.random() * 115 - 5}%;animation-duration:${(.55 + Math.random() * .5).toFixed(2)}s;animation-delay:-${Math.random().toFixed(2)}s;opacity:${(.3 + Math.random() * .6).toFixed(2)}"></i>`;
    if (state.weather === 'snow') for (let i = 0; i < 60; i++) {
      const s = (.25 + Math.random() * .5).toFixed(2);
      html += `<i class="flake" style="right:${Math.random() * 100}%;width:calc(var(--u)*${s});height:calc(var(--u)*${s});animation-duration:${(8 + Math.random() * 9).toFixed(1)}s;animation-delay:-${(Math.random() * 14).toFixed(1)}s;opacity:${(.5 + Math.random() * .5).toFixed(2)}"></i>`;
    }
    fx.innerHTML = html;
  });
}

function render() {
  const m = nowMin(), phase = phaseOf(m), sky = skyOf(phase, state.weather), orb = orbPos(m);
  Object.assign(stage.dataset, { phase, weather: state.weather, dim: state.time === 'dim' ? 1 : 0, scheme: sky.scheme });
  ['--s1', '--s2', '--s3'].forEach((v, i) => stage.style.setProperty(v, sky.c[i]));
  stage.style.setProperty('--glow', sky.glow);
  stage.style.setProperty('--veil', sky.veil);
  document.querySelectorAll('.sty').forEach(s => s.classList.toggle('on', s.dataset.style === state.style));
  document.querySelectorAll('.orb').forEach(o => { o.classList.toggle('moon', !orb.day); o.style.left = orb.left + '%'; o.style.top = orb.top + '%'; });

  const dateStr = new Intl.DateTimeFormat('he-IL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date());
  fill('fam', 'משפחת כהן');
  fill('clock', hhmm(m).replace(':', '<span class="colon">:</span>'));
  fill('date', dateStr);
  fill('dateline', `${dateStr}<small>יקנעם עילית · ${WX[state.weather].text} ${WX[state.weather].temp}°</small>`);
  fill('motto', `<small>משפט היום</small>${QUOTE}`);
  fill('quote', `<small>משפט היום</small>${QUOTE}`);
  fill('wxnow', R.wxnow(phase === 'night'));
  fill('fc', R.fc());
  fill('arcsvg', R.arcsvg(m));
  fill('arc', R.arcsvg(m) + `<div class="ends">${R.suntimes()}</div>`);
  fill('suntimes', R.suntimes());
  // בבוקר מציגים את הכריכים של היום; אחרי שיוצאים לבית הספר עוברים לכריכים של מחר
  fill('sandtitle', `כריכים לבית הספר <em>· ${m < 480 ? 'היום' : 'מחר'}</em>`);
  fill('sand', R.sand()); fill('meals', R.meals()); fill('acts', R.acts(m)); fill('tasks', R.tasks()); fill('bdays', R.bdays());

  document.querySelectorAll('.bar .grp').forEach(g =>
    g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === String(state[g.dataset.group])))));
}

// שכבות השמיים והתמונות נבנות פעם אחת
document.querySelectorAll('[data-slot="sky"]').forEach(box => {
  box.innerHTML = `<div class="layer sky"></div><div class="layer glow"></div><div class="layer stars"></div>${box.dataset.orb ? '<div class="orb"></div>' : ''}
    <div class="layer clouds"><i></i><i></i><i></i></div><div class="layer veil"></div><div class="layer fog"><i></i><i></i><i></i></div><div class="layer fx"></div>`;
});
document.querySelectorAll('[data-slot="photo"]').forEach(box => {
  box.innerHTML = PHOTOS.map((src, i) => `<img src="${src}" alt="" class="${i ? '' : 'on'}">`).join('');
});
let photoIdx = 0;
setInterval(() => {
  photoIdx = (photoIdx + 1) % PHOTOS.length;
  document.querySelectorAll('[data-slot="photo"]').forEach(box => [...box.children].forEach((img, i) => img.classList.toggle('on', i === photoIdx)));
}, 7000);

document.querySelector('.bar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const group = b.parentElement.dataset.group;
  state[group] = b.dataset.v;
  if (group === 'weather') particles();
  render();
});
const initial = new URLSearchParams(location.search).get('style');
if (initial) state.style = initial;
setInterval(() => { if (state.time === 'live') render(); }, 15000);
render();
</script>
</body>
</html>
